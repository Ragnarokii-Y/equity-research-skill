<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc"><title id="title">从研究输入到报告交付的四步流程</title><desc id="desc">先冻结研究范围和日期，再采集并核对证据，形成有因果关系的投资判断，最后制作报告、核验版式与来源。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8190a5"/></marker></defs><rect width="1280" height="410" rx="20" fill="#f2f5fa"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="36" y="43" font-size="23" font-weight="700" fill="#152740">从公司问题出发，让判断与证据相互对应</text><text x="36" y="72" font-size="14" fill="#63758c">流程适用于完整报告；指定页修订和段落改写按授权范围执行。</text><rect x="36" y="102" width="284" height="218" rx="14" fill="#fff" stroke="#dce3ed"/><rect x="36" y="102" width="284" height="5" rx="2" fill="#2563a6"/><text x="58" y="147" font-size="27" font-weight="700" fill="#2563a6">01</text><text x="58" y="185" font-size="21" font-weight="700" fill="#1b2c45">明确研究边界</text><text x="58" y="223" font-size="15" fill="#52647b">公司与证券代码</text><text x="58" y="254" font-size="15" fill="#52647b">信息及估值基准日</text><text x="58" y="285" font-size="15" fill="#52647b">本地样稿与交付范围</text><path d="M323 209h18" stroke="#8190a5" stroke-width="2" marker-end="url(#arrow)"/><rect x="344" y="102" width="284" height="218" rx="14" fill="#fff" stroke="#dce3ed"/><rect x="344" y="102" width="284" height="5" rx="2" fill="#087f83"/><text x="366" y="147" font-size="27" font-weight="700" fill="#087f83">02</text><text x="366" y="185" font-size="21" font-weight="700" fill="#1b2c45">搜集并核对证据</text><text x="366" y="223" font-size="15" fill="#52647b">公告、官网与行业资料</text><text x="366" y="254" font-size="15" fill="#52647b">Excel iFinD 公式与快照</text><text x="366" y="285" font-size="15" fill="#52647b">统一期间、单位和统计范围</text><path d="M631 209h18" stroke="#8190a5" stroke-width="2" marker-end="url(#arrow)"/><rect x="652" y="102" width="284" height="218" rx="14" fill="#fff" stroke="#dce3ed"/><rect x="652" y="102" width="284" height="5" rx="2" fill="#5f62a5"/><text x="674" y="147" font-size="27" font-weight="700" fill="#5f62a5">03</text><text x="674" y="185" font-size="21" font-weight="700" fill="#1b2c45">形成投资论证</text><text x="674" y="223" font-size="15" fill="#52647b">公司 → 行业 → 预测估值</text><text x="674" y="254" font-size="15" fill="#52647b">必要背景 → 证据 → 盈利影响</text><text x="674" y="285" font-size="15" fill="#52647b">事实、预测与判断分开表达</text><path d="M939 209h18" stroke="#8190a5" stroke-width="2" marker-end="url(#arrow)"/><rect x="960" y="102" width="284" height="218" rx="14" fill="#fff" stroke="#dce3ed"/><rect x="960" y="102" width="284" height="5" rx="2" fill="#a36a25"/><text x="982" y="147" font-size="27" font-weight="700" fill="#a36a25">04</text><text x="982" y="185" font-size="21" font-weight="700" fill="#1b2c45">制作与交付验收</text><text x="982" y="223" font-size="15" fill="#52647b">可编辑 PPTX 与 PDF</text><text x="982" y="254" font-size="15" fill="#52647b">数据底稿与逐页来源</text><text x="982" y="285" font-size="15" fill="#52647b">渲染、边界检测及人工检查</text><rect x="36" y="341" width="1208" height="40" rx="10" fill="#e2eaf4"/><text x="640" y="367" text-anchor="middle" font-size="15" fill="#344d6c">贯穿全程：日期一致 · 原始值留存 · 口径互核 · 缺口明示 · 修订后复验</text></g></svg>